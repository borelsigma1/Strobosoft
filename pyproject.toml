[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "strobosoft"
version = "0.1.0"
description = "Stroboskopbilder aus Videos für den Physikunterricht"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "opencv-contrib-python-headless>=4.8", "PySide6>=6.6"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.gui-scripts]
strobosoft = "strobosoft.gui.app:main"

[tool.setuptools.packages.find]
include = ["strobosoft*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
